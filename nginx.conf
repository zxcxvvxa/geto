worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;

# Move error log to memory/stderr to prevent disk I/O blocking
error_log stderr crit;

events {
    worker_connections 161072;
    multi_accept on;
    use epoll;
}

http {
    # Disable access logs completely to strip I/O latency on every packet
    access_log off;

    # Core TCP zero-copy & low latency settings
    sendfile on;
    tcp_nopush off;      # Turned OFF globally for low latency (don't delay packets to fill buffers)
    tcp_nodelay on;      # Disables Nagle's algorithm immediately on all connections

    # Upstream HTTP/1.1 Keepalive Connection Pool
    # Keeps persistent connections open to local backends, eliminating TCP handshake overhead per request
    upstream ws_bridge_backend {
        server 127.0.0.1:2222;
        keepalive 1024;
    }

    upstream vlws_backend {
        server 127.0.0.1:10085;
        keepalive 1024;
    }

    upstream trws_backend {
        server 127.0.0.1:10086;
        keepalive 1024;
    }

    upstream trxh_backend {
        server 127.0.0.1:10087;
        keepalive 1024;
    }

    upstream vlxh_backend {
        server 127.0.0.1:10088;
        keepalive 1024;
    }

    upstream sub_server_backend {
        server 127.0.0.1:8000;
        keepalive 64;
    }

    # Connection keepalive timeouts
    keepalive_timeout 300s;
    keepalive_requests 100000;

    # Websocket header fallback mappings
    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "YTNkNThmYWRiMTc4NDAxNg==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080 reuseport backlog=65535;
        server_name _;

        # Optimize proxy buffers to minimum needed to prevent buffer latency
        proxy_buffers 8 64k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;

        location /sub {
            proxy_pass http://sub_server_backend/sub;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /geto {
            proxy_pass http://ws_bridge_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Disable buffering for real-time bi-directional streaming
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 3s;
            proxy_socket_keepalive on;
        }

        location /vlws {
            proxy_redirect off;
            proxy_pass http://vlws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 3s;
            proxy_socket_keepalive on;
        }

        location /trws {
            proxy_redirect off;
            proxy_pass http://trws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 3s;
            proxy_socket_keepalive on;
        }

        location /trxh {
            proxy_redirect off;
            proxy_pass http://trxh_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
            
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 3s;
            proxy_socket_keepalive on;
        }

        location /vlxh {
            proxy_redirect off;
            proxy_pass http://vlxh_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
            
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 3s;
            proxy_socket_keepalive on;
        }

        location / {
            return 302 https://youtu.be/GmG4X9PGOXs?si=mMPyEzoRrEB33Gol;
        }
    }
}
