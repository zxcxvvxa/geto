worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 161072;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;

    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "YTNkNThmYWRiMTc4NDAxNg==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080 reuseport;
        server_name _;

        location /sub {
            proxy_pass http://127.0.0.1:8000/sub;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /geto {
            proxy_pass http://127.0.0.1:22;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            tcp_nopush off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 5s;
            proxy_socket_keepalive on;
        }

        location /vlws {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 5s;
            proxy_socket_keepalive on;
        }

        location /trws {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10086;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 5s;
            proxy_socket_keepalive on;
        }

        location /trxh {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10087;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 5s;
            proxy_socket_keepalive on;
        }

        location /vlxh {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10088;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 5s;
            proxy_socket_keepalive on;
        }

        location / {
            return 302 https://youtu.be/GmG4X9PGOXs?si=mMPyEzoRrEB33Gol;
        }
    }
}
